name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      # Non-blocking today: the calibrated .swiftlint.yml reports ~140 warnings / 0 errors,
      # so this surfaces annotations without failing the build. Once warnings are burned
      # down, add `--strict` to make any remaining warning fail CI.
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build-and-test:
    name: Build & Unit Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner's default Xcode builds this iOS 17 target. To pin explicitly, uncomment
      # and set a version present on the image (check with: ls /Applications | grep Xcode).
      # - name: Select Xcode
      #   run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # GoogleService-Info.plist is gitignored but required to build (it is in the app's
      # Resources build phase). Store a base64 copy of the local file in the repo secret
      # GOOGLE_SERVICE_INFO_PLIST_B64 (macOS: base64 -i TechnIQ/GoogleService-Info.plist | pbcopy).
      - name: Inject Firebase config
        env:
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: echo "$GOOGLE_SERVICE_INFO" | base64 --decode > TechnIQ/GoogleService-Info.plist

      # UI tests (TechnIQUITests) are in the shared scheme but excluded here via
      # -only-testing: they need seeded auth state and are slow/flaky on CI. Add a
      # separate job/scheme for them when that state is scriptable.
      # The simulator is resolved at runtime so the job survives runner-image changes.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -1 | sed -E 's/^ +//; s/ \([0-9A-F-]+\).*$//')
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator on this image" >&2; exit 1; fi
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # SWIFT/CLANG_ENABLE_EXPLICIT_MODULES=NO: Xcode 26's explicitly-built modules
      # cannot precompile FirebaseFirestoreInternal's generated module map (missing
      # Foundation dep). Must be passed on the command line so it reaches SPM package
      # targets. Drop when Firebase/Apple fix the module map.
      - name: Build and unit test
        run: |
          set -o pipefail
          xcodebuild \
            -project TechnIQ.xcodeproj \
            -scheme TechnIQ \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -only-testing:TechnIQTests \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            clean test
